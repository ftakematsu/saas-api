name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: pdo_mysql, redis
          coverage: none

      - name: 📦 Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: 🔍 Lint
        run: ./.ci/lint.sh

      - name: 🧪 Tests
        run: ./.ci/test.sh
